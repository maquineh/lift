[workspace]
members = [
    "crates/lift_ast",
    "crates/lift_lexer",
    "crates/lift_parser",
    "crates/lift_sema",
    "crates/lift_codegen",
    "crates/lift_project",
    "crates/lift_cli",
    "stdlib/lift_core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"

[workspace.dependencies]
ariadne = "=0.6.0"
logos = "0.16.1"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.23"
lift_ast = { path = "crates/lift_ast" }
lift_lexer = { path = "crates/lift_lexer" }
lift_parser = { path = "crates/lift_parser" }
lift_sema = { path = "crates/lift_sema" }
lift_codegen = { path = "crates/lift_codegen" }
lift_project = { path = "crates/lift_project" }
