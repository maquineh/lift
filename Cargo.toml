[workspace]
members = [
    "crates/truxt_ast",
    "crates/truxt_lexer",
    "crates/truxt_parser",
    "crates/truxt_sema",
    "crates/truxt_codegen",
    "crates/truxt_cli",
    "stdlib/truxt_core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
logos = "0.16.1"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0"
truxt_ast = { path = "crates/truxt_ast" }
truxt_lexer = { path = "crates/truxt_lexer" }
truxt_parser = { path = "crates/truxt_parser" }
truxt_sema = { path = "crates/truxt_sema" }
truxt_codegen = { path = "crates/truxt_codegen" }
